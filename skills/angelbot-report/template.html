<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--@TITLE@--></title>
<style>
:root{--bg:#f7f6f3;--panel:#ffffff;--fg:#1d1f23;--muted:#666a73;--line:#e3e1db;--accent:#2f5fd0;--bad:#c4382f;--ok:#2a7a4b;--warn:#a86a10;--grid:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1c1f25;--fg:#e8e9ec;--muted:#9aa0ab;--line:#2c3038;--accent:#7aa2ff;--bad:#ff7d73;--ok:#59c08a;--warn:#e0a24a;--grid:#262a31;color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1{font:400 28px/1.15 Georgia,"Iowan Old Style",serif;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
.sub,.note{color:var(--muted);font-size:13px;margin:0}
.take{margin:0;font-size:16px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted);font-size:13px}
.banner i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:400 28px/1.2 Georgia,"Iowan Old Style",serif;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.chart{margin-top:12px}
.chart svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .zl{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
svg .ax{stroke:var(--muted);stroke-width:1}
svg .t{fill:var(--muted);font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg .tb{fill:var(--fg);font-size:15px;font-weight:600;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg .dt{fill:var(--accent)}
svg .hit{fill:transparent}
svg .bp{fill:var(--accent)}
svg .bn{fill:var(--bad)}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(80px,120px) 1fr minmax(84px,auto);align-items:center;gap:10px}
.bar .lab{font-size:13px;color:var(--muted)}
.bar .track{height:16px}
.bar .fill{height:100%;border-radius:4px;min-width:2px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums}
.f-muted{background:var(--muted)}.f-bad{background:var(--bad)}.f-acc{background:var(--accent)}
.scroll{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.off{color:var(--muted)}
ul{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
footer{color:var(--muted);font-size:12px}
@media (max-width:480px){.hide-s{display:none}}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px 16px;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.panel{display:flex;flex-direction:column;gap:16px}
.ph{font:400 22px/1.2 Georgia,"Iowan Old Style",serif}
.js .ph{display:none}
@media print{html,body{background:#fff}.card,.banner{break-inside:avoid}.tabs{display:none!important}.panel[hidden]{display:flex!important}.js .ph{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AngelBot report</h1>
  </header>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
    <button type="button" role="tab" data-tab="month" aria-selected="false">Month</button>
  </nav>
  <div class="panel" id="today" role="tabpanel"><!--@TODAY@--></div>
  <div class="panel" id="month" role="tabpanel"><!--@MONTH@--></div>
  <footer><!--@FOOT@--></footer>
</div>
<script type="application/json" id="report-data"><!--@JSON@--></script>
<script>
/* Tabs are an extra: without this script both panels are simply shown one after the other. */
(function () {
  var d = document, nav = d.getElementById('tabs');
  if (!nav || !d.querySelectorAll) return;
  var btns = nav.querySelectorAll('button'), panels = d.querySelectorAll('.panel');
  function show(id, remember) {
    for (var i = 0; i < panels.length; i++) panels[i].hidden = panels[i].id !== id;
    for (var j = 0; j < btns.length; j++) btns[j].setAttribute('aria-selected', btns[j].getAttribute('data-tab') === id ? 'true' : 'false');
    if (remember) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }   // only after a tap: a hash set at load makes the browser jump to the panel
  }
  d.documentElement.className += ' js';
  nav.hidden = false;
  for (var k = 0; k < btns.length; k++) btns[k].addEventListener('click', function () { show(this.getAttribute('data-tab'), true); });
  show((location.hash || '').slice(1) === 'month' ? 'month' : 'today', false);
})();
</script>
</body>
</html>
