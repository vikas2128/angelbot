<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AngelBot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AngelBot</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img src="/icon.svg" alt="" width="26" height="26"><span>AngelBot</span></div>
    <span id="conn" class="pill off" title="Live connection">connecting</span>
  </header>

  <main id="view" aria-live="polite">
    <p class="muted center">Loading…</p>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="home" class="on"><span class="ic">◉</span><span>Home</span></button>
    <button data-tab="trades"><span class="ic">≡</span><span>Trades</span></button>
    <button data-tab="screener"><span class="ic">⌕</span><span>Screener</span></button>
    <button data-tab="report"><span class="ic">▤</span><span>Report</span></button>
    <button data-tab="alerts"><span class="ic">!</span><span>Alerts</span></button>
    <button data-tab="settings"><span class="ic">⚙</span><span>Settings</span></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
