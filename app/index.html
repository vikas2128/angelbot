<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AngelBot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>AngelBot</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img src="/icon.svg" alt=""><span id="title">AngelBot</span></div>
    <div class="hdr-r"><span id="conn" class="pill off" title="Live connection">connecting</span><span id="hdr-action"></span></div>
  </header>

  <main id="view" aria-live="polite">
    <p class="muted center">Loading…</p>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <button data-tab="home" data-icon="home" class="on"><span>Home</span></button>
    <button data-tab="trades" data-icon="trades"><span>Trades</span></button>
    <button data-tab="screener" data-icon="screener"><span>Screener</span></button>
    <button data-tab="report" data-icon="report"><span>Report</span></button>
    <button data-tab="alerts" data-icon="alerts"><span>Alerts</span></button>
    <button data-tab="settings" data-icon="settings"><span>Settings</span></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
